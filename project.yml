name: FlashcardsApp
options:
  bundleIdPrefix: com.dennishsu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  FlashcardsApp:
    type: application
    platform: iOS
    sources:
      - path: FlashcardsApp
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dennishsu.FlashcardsApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    info:
      path: FlashcardsApp/Info.plist
      properties:
        UILaunchScreen: {}

  FlashcardsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlashcardsAppTests
        type: group
    dependencies:
      - target: FlashcardsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dennishsu.FlashcardsAppTests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FlashcardsApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FlashcardsApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
